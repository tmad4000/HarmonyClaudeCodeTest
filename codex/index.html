<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmony Buddy</title>
  <link rel="stylesheet" href="style.css">
  <!-- ONNX Runtime (global `ort`) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.0/dist/ort.min.js"></script>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <h1>Harmony Buddy</h1>
        <p>Sing into your mic and get a live harmony voice in under 40&nbsp;ms.</p>
      </div>
      <button id="start-btn" class="cta">Start</button>
    </section>

    <section class="controls">
      <div class="control">
        <label for="interval">Interval</label>
        <select id="interval">
          <option value="0">Unison (debug)</option>
          <option value="4" selected>Major 3rd (+4)</option>
          <option value="3">Minor 3rd (+3)</option>
          <option value="7">Perfect 5th (+7)</option>
          <option value="12">Octave (+12)</option>
        </select>
      </div>
      <div class="control">
        <label for="mix">Harmony Mix</label>
        <input id="mix" type="range" min="0" max="1" value="0.6" step="0.05">
      </div>
      <div class="control">
        <label for="formant">Formant offset (cents)</label>
        <input id="formant" type="range" min="-200" max="200" value="0" step="10">
      </div>
      <div class="control">
        <label for="dry">Dry level</label>
        <input id="dry" type="range" min="0" max="1" value="1" step="0.05">
      </div>
    </section>

    <section class="status">
      <div>
        <span class="label">Detected pitch:</span>
        <span id="pitch-readout">--</span>
      </div>
      <div>
        <span class="label">Confidence:</span>
        <span id="conf-readout">--</span>
      </div>
      <div>
        <span class="label">Latency budget:</span>
        <span id="latency-readout">&lt; 40 ms target</span>
      </div>
    </section>

    <section class="notice">
      <p>First run will fetch: onnxruntime-web (~1 MB), SoundTouch worklet (~40 KB), and the PESTO ONNX model (you provide or edit URL in <code>src/main.js</code>).</p>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
