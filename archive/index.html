<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony Singer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .controls {
            margin: 30px 0;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin: 20px 0;
            font-size: 1.2em;
        }
        .harmony-controls {
            margin: 20px 0;
        }
        select, input[type="range"] {
            margin: 10px;
            padding: 8px;
            border-radius: 5px;
            border: none;
        }
        .pitch-display {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Harmony Singer</h1>
        
        <div class="status" id="status">Click "Start Listening" to begin</div>
        
        <div class="controls">
            <button id="startBtn">Start Listening</button>
            <button id="stopBtn" disabled>Stop</button>
        </div>
        
        <div class="harmony-controls">
            <label>
                Harmony Type:
                <select id="harmonyType">
                    <option value="third">Third (Major)</option>
                    <option value="fifth">Fifth</option>
                    <option value="octave">Octave</option>
                    <option value="minorThird">Third (Minor)</option>
                </select>
            </label>
            
            <label>
                Volume:
                <input type="range" id="volume" min="0" max="100" value="50">
            </label>
        </div>
        
        <div class="pitch-display">
            <div>Volume Level: <span id="volumeLevel">-</span></div>
            <div>Detected Note: <span id="detectedNote">-</span></div>
            <div>Harmony Note: <span id="harmonyNote">-</span></div>
        </div>
    </div>

    <script src="harmony-app.js"></script>
</body>
</html>
